name: Build & publish to itch.io

on:
  push:
    branches: [main]
    # Version tags (v1.0, v1.1…) are archived on itch in their own channel
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and archive (leave empty for a regular build)
        required: false
      platform:
        description: Platforms to build
        type: choice
        options: [both, WebGL, Windows]
        default: both

concurrency:
  group: build-${{ github.ref }}-${{ inputs.tag }}-${{ inputs.platform }}
  cancel-in-progress: true

env:
  PROJECT_PATH: LudumDare60
  BUILD_NAME: Rupestre
  ITCH_GAME: rascar-capac/rupestre
  # Tag to archive: the pushed tag, or the one given to a manual run
  ARCHIVE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

jobs:
  build:
    name: ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # WebGL is only built on manual runs, Windows on every run unless excluded by the platform input.
        # WebGL builds land in a subfolder named after the build.
        include: >-
          ${{ fromJSON(format('[{0}{1}{2}]',
            github.event_name == 'workflow_dispatch' && inputs.platform != 'Windows'
              && '{"targetPlatform":"WebGL","channel":"html5","pushPath":"build/WebGL/Rupestre"}'
              || '',
            inputs.platform == 'both' && ',' || '',
            inputs.platform != 'WebGL'
              && '{"targetPlatform":"StandaloneWindows64","channel":"windows","pushPath":"build/StandaloneWindows64"}'
              || '')) }}

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles(format('{0}/Assets/**', env.PROJECT_PATH), format('{0}/Packages/**', env.PROJECT_PATH), format('{0}/ProjectSettings/**', env.PROJECT_PATH)) }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: ${{ env.BUILD_NAME }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_NAME }}-${{ matrix.targetPlatform }}
          path: ${{ matrix.pushPath }}
          retention-days: 7

      - name: Install butler
        run: |
          curl -fsSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d "$HOME/butler"
          chmod +x "$HOME/butler/butler"
          echo "$HOME/butler" >> "$GITHUB_PATH"

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          CHANNEL="${{ matrix.channel }}"
          if [[ -n "$ARCHIVE_TAG" ]]; then
            USERVERSION="$ARCHIVE_TAG"
            # Only the latest WebGL build is kept on itch, tags don't archive it
            if [[ "$CHANNEL" != html5 ]]; then
              CHANNEL="$CHANNEL-$ARCHIVE_TAG"
            fi
          else
            USERVERSION="${{ github.run_number }}-${GITHUB_SHA::7}"
          fi
          butler push "${{ matrix.pushPath }}" "$ITCH_GAME:$CHANNEL" \
            --userversion "$USERVERSION" \
            --ignore '*_BurstDebugInformation_DoNotShip'
